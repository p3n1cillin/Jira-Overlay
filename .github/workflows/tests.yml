name: Windows regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: ./.github/actions/installer
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*-Setup.exe
            dist/*-Setup.exe.sha256
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install ruff==0.15.20
      - run: python -m ruff check .
      - run: python tests/run_all.py
      - run: python -m compileall -q app installer source_layout.py triage_review.py triage_eval.py
      - run: python release_tools.py --output dist
