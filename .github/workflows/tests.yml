name: Tests

# Both apps are Windows-only (winreg, DWM/DPAPI via ctypes, pystray, tkinter),
# so this only ever makes sense on a Windows runner — there is no Linux/macOS
# job to fall back to.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the documented floor (setup.py's MIN_PYTHON); 3.13 is
        # current. Both matter: most real installs will be whatever Python
        # someone already has, not necessarily the newest one.
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the test suite
        run: python tests/run_all.py
