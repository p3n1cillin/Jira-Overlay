name: Publish application release
on:
  push:
    tags: ['v20*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, e.g. v2026.10.20.1'
        required: true
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install ruff==0.15.20
      - run: python -m ruff check .
      - run: python tests/run_all.py
  publish:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      JIRA_SIGNING_THUMBPRINT: ${{ vars.JIRA_SIGNING_THUMBPRINT }}
      JIRA_SIGNTOOL: ${{ vars.JIRA_SIGNTOOL }}
      JIRA_TIMESTAMP_URL: ${{ vars.JIRA_TIMESTAMP_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python release_tools.py --output dist --check-tag "$env:RELEASE_TAG"
      - uses: ./.github/actions/installer
      - name: Verify publisher signatures when signing is configured
        shell: pwsh
        env:
          APPROVED_SIGNER: ${{ vars.JIRA_SIGNING_THUMBPRINT }}
        run: |
          if (-not $env:APPROVED_SIGNER) {
            Write-Warning 'Unsigned build: signing is optional by project owner decision. Hash verification and endpoint-policy validation still apply; no zero-alert guarantee is made.'
            exit 0
          }
          if ($env:APPROVED_SIGNER -notmatch '^[0-9A-Fa-f]{40}$') { throw 'Invalid configured publisher thumbprint' }
          $files = @(Get-ChildItem dist/*-Setup.exe,dist/JiraOverlay-InstallerHelper.exe)
          if ($files.Count -ne 2) { throw 'Expected exactly one installer and one helper for signature validation' }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $env:APPROVED_SIGNER) { throw ('Release blocked: missing/invalid approved signature on ' + $file.Name) }
          }
      - name: Publish tested installer and source package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem dist/JiraOverlay-*.zip,dist/*-Setup.exe,dist/*.sha256 | ForEach-Object FullName)
          gh release create "$env:RELEASE_TAG" @assets --verify-tag --title "Jira Overlay $env:RELEASE_TAG" --notes-file dist/RELEASE_NOTES.md
