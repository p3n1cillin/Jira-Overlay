name: Publish application release
on:
  push:
    tags: ['v20*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, e.g. v2026.10.20.1'
        required: true
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install ruff==0.15.20
      - run: python -m ruff check .
      - run: python tests/run_all.py
  publish:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python release_tools.py --output dist --check-tag "$env:RELEASE_TAG"
      - uses: ./.github/actions/installer
      - name: Publish tested installer and source package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem dist/JiraOverlay-*.zip,dist/*-Setup.exe,dist/*.sha256 | ForEach-Object FullName)
          gh release create "$env:RELEASE_TAG" @assets --verify-tag --title "Jira Overlay $env:RELEASE_TAG" --notes-file dist/RELEASE_NOTES.md
