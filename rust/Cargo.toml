[workspace]
resolver = "3"
members = ["crates/jo-core", "crates/jo-jira", "crates/triage-engine", "crates/triage-learner", "crates/jo-overlay", "crates/jira-overlay"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
float_cmp = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

# The engine's differential tests replay thousands of decisions; keep them fast.
[profile.dev.package.triage-engine]
opt-level = 2
