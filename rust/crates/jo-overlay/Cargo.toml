[package]
name = "jo-overlay"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ab_glyph = "0.2.32"
chrono = "0.4.45"
# glow (OpenGL) rather than the default wgpu: a GDI-redirected GL surface
# works with layered-window alpha (the overlay's fades), and it builds faster.
eframe = { version = "0.37.0", default-features = false, features = ["glow", "accesskit", "default_fonts"] }
jo-core = { version = "0.1.0", path = "../jo-core" }
jo-jira = { version = "0.1.0", path = "../jo-jira" }
raw-window-handle = "0.6.2"
regex = "1.13.2"
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
tiny-skia = "0.12.0"
tray-icon = "0.27.0"
url = "2.5.9"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Diagnostics_Debug", "Win32_UI_Shell", "UI_Notifications", "Data_Xml_Dom", "Win32_System_Registry", "Win32_UI_HiDpi", "Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_Memory", "Win32_Security"] }
winreg = "0.56.0"

[lints]
workspace = true

[dev-dependencies]
egui_kittest = "0.37.0"
tempfile = "3.27.0"
