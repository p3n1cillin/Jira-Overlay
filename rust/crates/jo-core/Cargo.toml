[package]
name = "jo-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
hex = "0.4.3"
indexmap = "2.14.2"
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "native-tls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.11.2"
tempfile = "3.27.0"
thiserror = "2.0.21"
url = "2.5.9"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_Registry", "Win32_Storage_FileSystem"] }
winreg = "0.56.0"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
