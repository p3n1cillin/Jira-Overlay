[package]
name = "jira-overlay"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
jo-core = { version = "0.1.0", path = "../jo-core" }
jo-overlay = { version = "0.1.0", path = "../jo-overlay" }
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
triage-learner = { version = "0.1.0", path = "../triage-learner" }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_System_Threading"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
